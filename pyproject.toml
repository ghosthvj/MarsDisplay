[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-display"
version = "0.1.2"
description = "Hardware-independent foundation for a Windows MARS display companion"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "playwright==1.64.0",
    "PySide6==6.12.0",
    "Pillow==12.3.0",
    "pyserial==3.5",
]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3", "setuptools==84.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
