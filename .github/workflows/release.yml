name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z or vX.Y.ZrcN)'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate manual main release plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: python3 -B packaging/release.py plan --tag "$RELEASE_TAG"

  build:
    needs: prepare
    uses: ./.github/workflows/windows-portable.yml
    with:
      release_tag: ${{ inputs.tag }}
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download only this run's qualified portable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name MarsDisplay-Windows-x64 --dir release-assets
      - name: Validate assets and publish a new release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: python3 -B packaging/release.py publish --artifacts release-assets --tag "$RELEASE_TAG"
