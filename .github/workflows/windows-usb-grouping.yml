name: Isolated USB grouping experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grouping:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install existing pinned SDK
        run: python -m pip install '.[build]'
      - name: Browser prerequisite for existing source regression tests only
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: python -m playwright install chromium --only-shell
      - name: Source tests (zero skips; no real USB)
        env:
          QT_QPA_PLATFORM: offscreen
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PYTHONPATH: src;tests
        run: python -B -c "import unittest; r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); raise SystemExit(0 if r.wasSuccessful() and not r.skipped else 1)"
      - name: Independent console build and native no-device qualification
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(QT_|QML|PYTHON|PLAYWRIGHT_)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:PYTHONPATH = 'src'
          python -B packaging/build_grouping_experiment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() }}
        with:
          name: MarsDisplayGroupingExperiment-Windows-x64
          path: |
            dist/MarsDisplayGroupingExperiment-*-Windows-x64.zip
            dist/MarsDisplayGroupingExperiment-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
