name: Windows Python USB fixed-image probe
on:
  push:
    branches: [feat/native-python-usb-probe]
    paths:
      - 'src/mars_display/usb_*.py'
      - 'tools/windows-python-usb-probe/**'
      - 'tools/windows-usb-probe/pattern*'
      - 'tools/windows-usb-probe/rgb888-provenance.json'
      - 'tests/test_usb_*.py'
      - 'tests/test_native_probe_fixture.py'
      - 'tests/test_packaging_python_usb_probe.py'
      - '.github/workflows/windows-python-usb-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install pinned development SDK (no browser download)
        run: python -m pip install '.[build]'
      - name: Native focused tests, Analysis, legal qualification and extracted smoke
        id: native_build
        # The builder runs all five selected suites and rejects every skip,
        # including any skipped Win32 job/event test. Publication is last.
        run: python -B tools/windows-python-usb-probe/build_probe.py
      - name: Upload unqualified metadata only
        if: ${{ failure() && steps.native_build.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: PythonUsbProbe-UNQUALIFIED-native-diagnostics
          path: build/python-usb-probe-work/unqualified.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload qualified diagnostic ZIP and checksum only
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: PythonUsbProbe-Windows-x64
          path: |
            build/python-usb-probe/PythonUsbProbe-1.0.0-Windows-x64.zip
            build/python-usb-probe/PythonUsbProbe-1.0.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
