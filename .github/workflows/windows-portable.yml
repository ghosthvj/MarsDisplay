name: Windows portable prototype
on:
  push:
    branches: [feat/simulated-companion, feat/native-usb-helper]
  workflow_dispatch:
    inputs:
      layout_diagnostics:
        description: 'Capture isolated UI layout diagnostics without packaging'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install pinned application and build SDK
        run: python -m pip install '.[build]'
      - name: Install package-local Chromium headless shell
        if: ${{ !inputs.layout_diagnostics }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: python -m playwright install chromium --only-shell
      - name: Source tests (offscreen, not Windows tray acceptance)
        if: ${{ !inputs.layout_diagnostics }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PYTHONPATH: src;tests
        run: python -B -c "import unittest; r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); raise SystemExit(0 if r.wasSuccessful() and not r.skipped else 1)"
      - name: Isolated layout diagnostics (no packaging or hardware)
        if: ${{ inputs.layout_diagnostics }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PYTHONPATH: src;tests
          TEMP: ${{ github.workspace }}/build/windows-layout-diagnostics/tmp
          TMP: ${{ github.workspace }}/build/windows-layout-diagnostics/tmp
        run: |
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          python -B tools/windows-layout-diagnostics/diagnose.py
          exit $LASTEXITCODE
      - name: Upload isolated layout evidence only
        if: ${{ always() && inputs.layout_diagnostics }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: MarsDisplay-UI-layout-diagnostics
          path: |
            build/windows-layout-diagnostics/layout.json
            build/windows-layout-diagnostics/layout.png
            build/windows-layout-diagnostics/test-result.json
          if-no-files-found: error
          retention-days: 7
      # Native notices must be qualified from the actual Windows SDK/payload.
      # Without qualification, retain/upload metadata only, never binaries.
      - name: Native build and isolated packaged smoke
        id: native_build
        if: ${{ !inputs.layout_diagnostics }}
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(QT_|QML|PYTHON|PLAYWRIGHT_)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          python packaging/build_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unqualified metadata only
        if: ${{ failure() && steps.native_build.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: MarsDisplay-UNQUALIFIED-native-diagnostics
          path: build/unqualified-native-*.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        if: ${{ success() && !inputs.layout_diagnostics }}
        with:
          name: MarsDisplay-Windows-x64
          path: |
            dist/MarsDisplay-*-Windows-x64.zip
            dist/MarsDisplay-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
