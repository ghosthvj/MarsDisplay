name: Windows USB fixed-image probe
on:
  push:
    branches: [feat/usb-screen-probe]
    paths:
      - 'tools/windows-usb-probe/**'
      - '.github/workflows/windows-usb-probe.yml'
      - 'tests/test_native_probe_fixture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inbox Framework build and USB-free native verification
        shell: pwsh
        run: ./tools/windows-usb-probe/build.ps1
      - name: Upload verified native diagnostic
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UsbScreenProbe-Windows-x64
          path: |
            build/native-usb-probe/UsbScreenProbe-1.0.0-Windows-x64.zip
            build/native-usb-probe/UsbScreenProbe-1.0.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
